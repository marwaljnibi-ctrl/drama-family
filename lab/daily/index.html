<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Dailymotion test</title>
<style>body{font:14px/1.6 system-ui;padding:12px;max-width:720px;margin:auto}iframe{width:100%;aspect-ratio:16/9;border:0;background:#000;border-radius:10px}button{padding:9px 12px;margin:3px;border-radius:9px;border:1px solid #9E2B35;background:#9E2B35;color:#fff}#log{font:12px/1.5 monospace;direction:ltr;white-space:pre-wrap;background:#f4f4f2;padding:8px;border-radius:8px;max-height:300px;overflow:auto}</style></head><body>
<h3>Dailymotion: anne-yarisi-episode-7 (k6lDUha1qV3swMMBvfQ)</h3>
<div><button data-v="A">A: geo player + api=postMessage</button><button data-v="B">B: geo player بلا api</button><button data-v="C">C: legacy embed + api=postMessage</button><button data-v="D">D: geo + api، بلا sandbox</button><button data-v="E">E: geo بلا api وبلا sandbox</button></div>
<div id="net" style="font:12px monospace;direction:ltr"></div><div id="box"></div>
<div><button id="seek">أرسل seek 120 (تجريبي)</button><button id="cp">انسخ</button></div><div id="log"></div>
<script>
const ID='k6lDUha1qV3swMMBvfQ',O=location.origin,L=document.getElementById('log'),R=[];const log=m=>{R.push(m);L.textContent+=m+'\n';L.scrollTop=1e9};
const NOSB=new Set(["D","E"]);const U={D:`https://geo.dailymotion.com/player.html?video=${ID}&api=postMessage&origin=${encodeURIComponent(O)}`,E:`https://geo.dailymotion.com/player.html?video=${ID}`,A:`https://geo.dailymotion.com/player.html?video=${ID}&api=postMessage&origin=${encodeURIComponent(O)}`,B:`https://geo.dailymotion.com/player.html?video=${ID}`,C:`https://www.dailymotion.com/embed/video/${ID}?api=postMessage&origin=${encodeURIComponent(O)}`};
let fr=null;(async()=>{const o=[];for(const h of ["geo.dailymotion.com","www.dailymotion.com","static1.dmcdn.net"]){const t0=performance.now();try{await fetch("https://"+h+"/favicon.ico",{mode:"no-cors",cache:"no-store",signal:AbortSignal.timeout(10000)});o.push(h+": REACHABLE "+Math.round(performance.now()-t0)+"ms")}catch(e){o.push(h+": FAILED "+e.name)}}document.getElementById("net").innerHTML=o.join("<br>");log("NET "+o.join(" | "))})();
addEventListener('message',e=>{if(!fr||e.source!==fr.contentWindow)return;let d=e.data;const s=typeof d==='string'?d:JSON.stringify(d);log('MSG '+new URL(e.origin).host+' '+s.slice(0,160))});
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{const u=U[b.dataset.v];fr=document.createElement('iframe');fr.allow='autoplay; fullscreen; picture-in-picture';fr.allowFullscreen=true;if(!NOSB.has(b.dataset.v))fr.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation allow-forms');fr.src=u;fr.onload=()=>log('load '+b.dataset.v);document.getElementById('box').replaceChildren(fr);log('open '+b.dataset.v+' '+u.replace(/origin=.*/,'origin=…'))});
document.getElementById('seek').onclick=()=>{if(!fr)return;for(const m of ['seek?120',JSON.stringify({command:'seek',parameters:[120]}),{command:'seek',parameters:[120]}]){fr.contentWindow.postMessage(m,'*');log('SENT '+(typeof m==='string'?m:JSON.stringify(m)))}};
document.getElementById('cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(R.join('\n'));
</script></body></html>
