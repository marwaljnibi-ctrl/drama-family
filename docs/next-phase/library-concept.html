<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تصوّر مكتبة التنزيلات — Dizi</title>
<!-- تصوّر واجهة فقط. لا تخزين ولا تنزيل ولا استيراد ولا استكمال مشاهدة.
     الواجهة تقرأ من عقد LibraryStore (انظر الأسفل) ولا تعرف أين تُحفظ الملفات.
     للتشغيل محليًا:  node scripts/dev-server.mjs  ثم افتح /docs/next-phase/library-concept.html -->
<style>
:root{--bg:#FFFFFF;--surface:#F4F4F2;--border:#E5E5E3;--text:#111111;--muted:#6b6b68;--accent:#9E2B35;--accent-soft:#FBE9EA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 Tajawal,system-ui,sans-serif;padding-bottom:40px}
header{padding:16px;border-bottom:1px solid var(--border)}
h1{font-size:20px;font-weight:500;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.banner{margin:12px 16px;padding:10px 12px;background:var(--accent-soft);border-radius:10px;font-size:13px}
section{margin-top:20px}
h2{font-size:17px;font-weight:500;margin:0 16px 10px}
.row{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity}
.card{flex:0 0 132px;scroll-snap-align:start;cursor:pointer}
.poster{position:relative;width:132px;aspect-ratio:2/3;border-radius:10px;background:var(--surface) center/cover;border:1px solid var(--border);overflow:hidden}
.poster .badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(255,255,255,.92);border-radius:999px;padding:1px 8px;font-size:12px}
.bar{position:absolute;bottom:0;inset-inline:0;height:4px;background:rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:var(--accent)}
.ttl{font-size:13px;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.list{margin:0 16px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:0}
.item .thumb{width:44px;aspect-ratio:2/3;border-radius:6px;background:var(--surface) center/cover;border:1px solid var(--border);flex:none}
.item .main{flex:1;min-width:0}
.item .main b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--surface)}
.st.ready{background:var(--accent-soft);color:var(--accent)}
.st.bad{background:#fff3cd}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px}
.btn.ghost{background:var(--surface);color:var(--text)}
.tools{display:flex;gap:8px;margin:12px 16px;flex-wrap:wrap}
.tools label{font-size:13px;color:var(--muted)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--border);background:var(--bg)}
.empty{margin:20px 16px;padding:24px;text-align:center;color:var(--muted);background:var(--surface);border-radius:12px}
.storage{margin:12px 16px;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:13px}
.storage .meter{height:6px;border-radius:3px;background:var(--surface);margin-top:8px;overflow:hidden}
.storage .meter i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>مكتبتي</h1>
  <div class="sub">تصوّر واجهة — بيانات حقيقية من فهرس Dizi، وحالات التنزيل تجريبية</div>
</header>
<div class="banner">هذه الصفحة لا تحفظ ولا تنزّل شيئًا. الواجهة تتحدث مع <code>LibraryStore</code> فقط؛ والتخزين الحقيقي (OPFS أو IndexedDB أو غيرهما) يُركَّب لاحقًا تحت العقد نفسه.</div>

<div class="tools">
  <label>حالة تجريبية للمخزن:
    <select id="scenario">
      <option value="rich">مكتبة ممتلئة</option>
      <option value="empty">فارغة</option>
      <option value="lowspace">مساحة منخفضة</option>
    </select>
  </label>
</div>

<div id="app"></div>

<script type="module">
/* ============================================================
   عقد LibraryStore — هو الحد الفاصل بين الواجهة والتخزين.
   أي تنفيذ مستقبلي (OPFS / IndexedDB / ملفات) يلتزم بهذا الشكل فقط.

   LibraryEntry = {
     key:      string   // showId + '|' + epId  (نفس مفتاح progress الحالي)
     showId:   string   // يطابق shows[].id
     epId:     string   // يطابق shows[].eps[].id (وليس رقم الحلقة n)
     epNum:    number   // للعرض فقط
     size:     number   // بايت
     state:    'ready' | 'partial' | 'missing'   // missing: الملف اختفى (إخلاء iOS مثلًا)
     addedAt:  number
     time:     number   // ثواني التقدم (يأتي من progress لاحقًا، اختياري)
     duration: number
   }
   LibraryStore = {
     list():     Promise<LibraryEntry[]>
     usage():    Promise<{used:number, quota:number|null}>
     // لا يوجد هنا import/download/play: تُضاف لاحقًا خلف نفس الواجهة، وليست جزءًا من التصوّر.
   }
   ============================================================ */

// ---- مخزن تجريبي (Mock) — يبني حالات وهمية من الفهرس الحقيقي. لا يلمس أي تخزين. ----
function mockStore(data, scenario) {
  const withEps = data.shows.filter((s) => s.eps.length >= 3).slice(0, 14);
  const entries = [];
  if (scenario !== 'empty') {
    withEps.forEach((s, i) => {
      const n = 1 + (i % 3);
      s.eps.slice(0, n).forEach((e, j) => entries.push({
        key: s.id + '|' + e.id, showId: s.id, epId: e.id, epNum: e.n,
        size: (180 + ((i * 53 + j * 71) % 520)) * 1048576,
        state: (i + j) % 11 === 0 ? 'missing' : (i + j) % 7 === 0 ? 'partial' : 'ready',
        addedAt: Date.now() - (i * 5 + j) * 3600e3,
        time: (i + j) % 3 === 0 ? 600 + i * 40 : 0, duration: 2700 + j * 60,
      }));
    });
  }
  const used = entries.reduce((a, e) => a + e.size, 0);
  const quota = scenario === 'lowspace' ? used + 300 * 1048576 : 64 * 1073741824;
  return { list: async () => entries, usage: async () => ({ used, quota }) };
}

// ---- الواجهة: تقرأ من LibraryStore + فهرس Dizi فقط ----
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const AR = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
const mb = (b) => b >= 1073741824 ? AR((b / 1073741824).toFixed(1)) + ' غ.ب' : AR(Math.round(b / 1048576)) + ' م.ب';
const STATE = { ready: 'جاهزة', partial: 'غير مكتملة', missing: 'الملف غير موجود' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const BASE = '../../';

async function render(store, data) {
  const byShow = new Map(data.shows.map((s) => [s.id, s]));
  const epOf = (e) => byShow.get(e.showId)?.eps.find((x) => x.id === e.epId);
  const entries = await store.list(), { used, quota } = await store.usage();
  const app = document.getElementById('app'); app.innerHTML = '';
  if (!entries.length) { app.append($(`<div class="empty">مكتبتك فارغة.<br>الحلقات التي تضيفها لاحقًا ستظهر هنا للمشاهدة بلا إنترنت.</div>`)); return; }

  const pct = quota ? Math.min(100, Math.round(used / quota * 100)) : 0;
  app.append($(`<div class="storage">المستخدم: <b>${mb(used)}</b> ${quota ? `من ${mb(quota)}` : ''}${quota && quota - used < 512 * 1048576 ? ' — <span style="color:var(--accent)">المساحة تكاد تنفد</span>' : ''}<div class="meter"><i style="width:${pct}%"></i></div></div>`));

  const poster = (s) => s?.img ? `${BASE}${s.img}` : '';
  const card = (e, withBar) => {
    const s = byShow.get(e.showId), ep = epOf(e);
    const prog = e.duration ? Math.min(100, e.time / e.duration * 100) : 0;
    return $(`<div class="card" data-key="${esc(e.key)}"><div class="poster" style="background-image:url('${poster(s)}')"><span class="badge">${e.state === 'ready' ? 'حلقة ' + AR(ep?.n ?? e.epNum) : STATE[e.state]}</span>${withBar && prog ? `<div class="bar"><i style="width:${prog}%"></i></div>` : ''}</div><div class="ttl">${esc(s?.title ?? e.showId)}</div><div class="meta">حلقة ${AR(ep?.n ?? e.epNum)} · ${mb(e.size)}</div></div>`);
  };
  const row = (title, list, bar) => {
    if (!list.length) return;
    const sec = $(`<section><h2>${title}</h2><div class="row"></div></section>`);
    list.forEach((e) => sec.querySelector('.row').append(card(e, bar)));
    app.append(sec);
  };

  // صفوف على طريقة Netflix — كلها مشتقة من entries + الفهرس
  row('تابع المشاهدة', entries.filter((e) => e.state === 'ready' && e.time > 0), true);
  row('أُضيف مؤخرًا', [...entries].sort((a, b) => b.addedAt - a.addedAt).slice(0, 12), false);
  const showsWith = [...new Set(entries.map((e) => e.showId))];
  row('مسلسلاتي', showsWith.map((id) => entries.find((e) => e.showId === id)), false);

  const needFix = entries.filter((e) => e.state !== 'ready');
  const list = $(`<section><h2>إدارة الحلقات</h2><div class="list"></div></section>`);
  [...entries].sort((a, b) => b.size - a.size).slice(0, 12).forEach((e) => {
    const s = byShow.get(e.showId), ep = epOf(e);
    list.querySelector('.list').append($(`<div class="item"><div class="thumb" style="background-image:url('${poster(s)}')"></div><div class="main"><b>${esc(s?.title ?? e.showId)}</b><span class="meta">حلقة ${AR(ep?.n ?? e.epNum)} · ${mb(e.size)}</span></div><span class="st ${e.state === 'ready' ? 'ready' : 'bad'}">${STATE[e.state]}</span><button class="btn ghost" type="button" disabled title="غير مفعّل في التصوّر">حذف</button></div>`));
  });
  app.append(list);
  if (needFix.length) app.append($(`<div class="banner">${AR(needFix.length)} حلقة تحتاج إعادة استيراد (غير مكتملة أو اختفى ملفها). في التنفيذ الحقيقي يظهر هنا زر «استيراد من الملفات» لكل حلقة.</div>`));
}

(async () => {
  let data; try { data = await (await fetch(BASE + 'data/shows.json')).json(); } catch { document.getElementById('app').textContent = 'تعذّر تحميل الفهرس. شغّل node scripts/dev-server.mjs من جذر المشروع.'; return; }
  const sel = document.getElementById('scenario');
  const go = () => render(mockStore(data, sel.value), data);
  sel.onchange = go; go();
})();
</script>
</body>
</html>
