name: sync-shows
on:
  schedule: [{ cron: '*/5 * * * *' }]
  workflow_dispatch:
    inputs:
      full: { description: 'مزامنة كاملة (1)', required: false, default: '0' }
      limit: { description: 'عدد الحلقات لفهرسة سيرفراتها في هذا التشغيل (للفهرسة الدفعية اليدوية)', required: false, default: '' }
permissions: { contents: write }
concurrency: sync
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund sharp
      - name: sync in chunks (each chunk is committed and pushed)
        timeout-minutes: 330
        env: { SYNC_FULL: '${{ github.event.inputs.full }}', LIMIT: '${{ github.event.inputs.limit || 300 }}', TMDB_API_KEY: '${{ secrets.TMDB_API_KEY }}' }
        run: bash scripts/sync-run.sh
