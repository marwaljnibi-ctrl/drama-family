name: probe
on:
  workflow_dispatch:
    inputs:
      script: { description: 'script file', required: false, default: 'probe-player.mjs' }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund playwright && npx playwright install --with-deps chromium
      - run: node scripts/${{ github.event.inputs.script }}
      - uses: actions/upload-artifact@v4
        with: { name: shot, path: probe-*.png }
