name: exp-posters
# تشغيل محرك الهوية على غير المعتمد (+ معايرة على عيّنة معتمدة) ورفع النتيجة كـ artifact للمراجعة. لا يلتزم بأي شيء.
on:
  push: { branches: ['exp/**'], paths: ['.github/run-posters.txt'] }
  workflow_dispatch: {}
jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund sharp
      - name: resolve the unapproved shows
        env: { TMDB_API_KEY: '${{ secrets.TMDB_API_KEY }}' }
        run: |
          node scripts/poster-pick.mjs --reratio 2>&1 | tail -n 90   # يستبدل البوستر العمودي غير 2:3 ببوستر 2:3 حقيقي لنفس المعرّف المؤكَّد عند توفره
          node scripts/poster-pick.mjs --xref 2>&1 | tail -n 90   # مصدر إضافي: بوستر 2:3 لنفس المسلسل عبر IMDb/TVDB→TMDB، بتحقق هوية
          node scripts/poster-pick.mjs --resolve 2>&1 | tail -n 60
      - name: live permanent testset (engine re-resolves the 24 from scratch, no writes)
        continue-on-error: true
        env: { TMDB_API_KEY: '${{ secrets.TMDB_API_KEY }}' }
        run: node scripts/poster-pick.mjs --testset 2>&1 | tail -n 40
      - name: what does the source page offer (cast/year/channel)?
        continue-on-error: true
        run: |
          node -e "
          const u='https://qesset.net/yeni-show/karadeniz-hqvms/';
          fetch(u,{headers:{'user-agent':'Mozilla/5.0','accept-language':'ar'}}).then(r=>r.text()).then(h=>{
            const t=h.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
            console.log('PAGE', h.length, (h.match(/<title>([^<]*)/)||[])[1]);
            for (const k of ['بطولة','تمثيل','سنة','القناة','عام الانتاج','قصة','النوع']) { const i=t.indexOf(k); console.log('K',k,i<0?'-':t.slice(Math.max(0,i-30),i+110)); }
          }).catch(e=>console.log('fetch failed', e.message));"
      - uses: actions/upload-artifact@v4
        with:
          name: posters
          path: |
            data/poster-map.json
            data/poster-review.json
            data/identity-index.json
            data/tr-catalog.json
            data/posters

