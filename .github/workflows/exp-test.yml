name: exp-test
on:
  push: { branches: ['exp/**'] }
  workflow_dispatch: {}
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund sharp
      - name: unit tests
        run: node --test scripts/test-posters.mjs scripts/test-xref.mjs scripts/test-identity.mjs scripts/test-search.mjs scripts/test.mjs scripts/test-family.mjs scripts/test-sync.mjs worker/spec/worker.test.mjs worker/spec/accounts.test.mjs
      - name: "install playwright (apt update and retries)"
        run: |
          npm i --no-save --no-audit --no-fund playwright
          for i in 1 2 3; do sudo apt-get update -qq || true; npx playwright install --with-deps chromium && break; echo "retry $i"; sleep 15; done
          npx playwright --version
      - name: make test clip (H.264+AAC, 90s)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && mkdir -p test && ffmpeg -loglevel error -y -f lavfi -i testsrc=size=640x360:rate=24 -f lavfi -i sine=frequency=440 -t 90 -c:v libx264 -pix_fmt yuv420p -preset ultrafast -c:a aac -movflags +faststart test/clip.mp4
      - name: make big file (700MB = valid mp4 + padding) for the memory test
        run: cp test/clip.mp4 test/big.mp4 && head -c 700M /dev/zero >> test/big.mp4 && ls -la test/big.mp4
      - name: import e2e (local server)
        run: |
          node scripts/poster-pick.mjs --apply data/shows.json   # يطبّق سجل البوسترات (img3) على لقطة الفهرس للاختبار
          node scripts/dev-server.mjs 8123 > /dev/null 2>&1 &
          sleep 2
          node scripts/test-import.mjs
          node scripts/test-home.mjs && node scripts/test-resume.mjs && node scripts/test-design.mjs && node scripts/test-type.mjs && node scripts/test-appfeel.mjs && node scripts/test-portrait-only.mjs && node scripts/test-ux1.mjs && node scripts/test-ux2.mjs && node scripts/test-swipe-remove.mjs && node scripts/test-ads.mjs && node scripts/test-resume-real.mjs
      - name: import e2e (published preview, only if scripts/preview-url.txt exists)
        run: |
          if [ -f scripts/preview-url.txt ]; then BASE="$(cat scripts/preview-url.txt)" node scripts/test-import.mjs; else echo "no preview url"; fi
      - name: check sample files and headers on the preview
        run: |
          U="$(cat scripts/preview-url.txt)"
          U="${U%/}"
          for p in "" "sample/" "sample/dizi-test-small.mp4" "manifest.webmanifest" "sw.js"; do
            echo "CHK $p $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}B' "$U/$p")"
          done
          echo "CHK range-mp4 $(curl -s -o /dev/null -w '%{http_code}' -H 'Range: bytes=0-99' "$U/sample/dizi-test-small.mp4")"
          echo "CHK noindex $(curl -sI "$U/" | grep -i x-robots-tag | cut -c1-80)"
